<script>
const PHRASES = [
  { id:1, german:'Grüß Gott', english:'Hello (formal)', pronunciation:'GRÜSS got',
    cultural:'The standard formal greeting in Vienna. Literally "May God greet you." Use it with shopkeepers, officials, and anyone older than you. Saying "Hallo" sounds like a tourist.' },
  { id:2, german:'Servus!', english:'Hi / Bye (casual)', pronunciation:'SAIR-voos',
    cultural:'The warm casual greeting between friends — works as both hello and goodbye. Don\'t use it with strangers or at the Magistrat. When a local says it to you, you\'ve arrived.' },
  { id:3, german:'Baba!', english:'Bye! (very Viennese)', pronunciation:'BAH-bah',
    cultural:'The most distinctly Viennese farewell. Often said twice — "Baba baba!" Tourists who use this instantly endear themselves to locals.' },
  { id:4, german:'Bitte schön', english:'Here you go / You\'re welcome', pronunciation:'BIT-eh shern',
    cultural:'You\'ll hear this from waiters and shopkeepers when serving you. Use it yourself when handing anything to someone — it smooths every interaction.' },
  { id:5, german:'Passt, danke', english:'That\'s fine, thanks', pronunciation:'PAHSST DAHN-keh',
    cultural:'"Passt!" alone means "it works" or "perfect." With "danke" it\'s a graceful way to close a transaction or politely decline something extra.' },
  { id:6, german:'Einen Melange, bitte', english:'A Melange coffee, please', pronunciation:'EYE-nen meh-LAHNG-eh BIT-eh',
    cultural:'The signature Viennese coffee — espresso with steamed milk foam. In a traditional Kaffeehaus, always order a Melange, not a "cappuccino." The latter marks you as a visitor.' },
  { id:7, german:'Zahlen, bitte', english:'The bill, please', pronunciation:'TSAH-len BIT-eh',
    cultural:'In Viennese cafés, waiters never bring the bill unprompted. Make eye contact and say this. Splitting bills is uncommon — one person typically pays.' },
  { id:8, german:'Stimmt so', english:'Keep the change', pronunciation:'SHTIMMT zo',
    cultural:'Said when paying cash to let the waiter keep the change as a tip. Tipping 10% or rounding up is standard in Kaffeehäuser. This phrase will get you a warm goodbye.' },
  { id:9, german:'Was kostet das?', english:'How much does this cost?', pronunciation:'vahs KOS-tet dahs',
    cultural:'Useful at the Naschmarkt, smaller shops, or anywhere prices aren\'t displayed. Vendors appreciate the effort — even if you both switch to English straight after.' },
  { id:10, german:'Das nehme ich', english:'I\'ll take this one', pronunciation:'dahs NAY-meh ikh',
    cultural:'Decisive and clear — Viennese appreciate directness in shops. Point at the item and say this instead of fumbling for a long explanation.' },
  { id:11, german:'Eine Jahreskarte, bitte', english:'An annual U-Bahn pass, please', pronunciation:'EYE-neh YAH-res-kar-teh BIT-eh',

  { id:12, german:'Wo ist die nächste U-Bahn-Station?', english:'Where is the nearest U-Bahn station?', pronunciation:'voh ist dee NAYKH-steh OO-bahn-shta-TSEE-on',
    cultural:'Vienna\'s U-Bahn has 5 lines (U1–U6, no U5 yet), runs until 0:30 on weekdays, and all night on weekends. It\'s clean, punctual, and essential.' },
  { id:13, german:'Entschuldigung', english:'Excuse me / Sorry', pronunciation:'ent-SHOOL-dee-goong',

  { id:14, german:'Ich verstehe nicht', english:'I don\'t understand', pronunciation:'ikh fair-SHTAY-eh nikht',

  { id:15, german:'Wie komme ich zum...?', english:'How do I get to...?', pronunciation:'vee KOM-meh ikh tsoom',

      { s:'You', de:'<span class="hl">Entschuldigung</span> — können Sie das wiederholen?', en:'Sorry — can you repeat that?' },
      { s:'Local', de:'Geradeaus, dann rechts. Ungefähr 10 Minuten zu Fuß.', en:'Straight, then right. About 10 minutes on foot.' },
      { s:'You', de:'Ah, verstanden! Das ist <span class="hl">im zweiten Bezirk,</span> ja?', en:'Ah, got it! That\'s in the 2nd district, right?' },
      { s:'Local', de:'Genau — Leopoldstadt. Viel Spaß!', en:'Exactly — Leopoldstadt. Have fun!' },
      { s:'You', de:'Danke schön! <span class="hl">Baba!</span>', en:'Thank you! Bye!' },
    ]},
];

function getWeekKey() {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  // Compare local midnights, not raw timestamps: a DST shift shortens or
  // lengthens the span by an hour, which would otherwise drag the week
  // boundary off midnight and wipe progress recorded either side of it.
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((today - jan1) / 86400000);
  const week = Math.floor((days + jan1.getDay()) / 7) + 1;
  return d.getFullYear() + '-W' + week;
}

function loadState() {
  try { return JSON.parse(localStorage.getItem('vgt_v1') || '{}'); }
  catch { return {}; }
}

function saveState() {
  try { localStorage.setItem('vgt_v1', JSON.stringify(state)); } catch {}
}

let state = loadState();
const thisWeek = getWeekKey();
if (state.weekKey !== thisWeek) {
  state = { weekKey: thisWeek, learnedThisWeek: [], ratings: state.ratings || {} };
  saveState();
}
// Carry over progress written by the old `learnedToday` key.
const needsMigration = ('learnedToday' in state) || ('weekCount' in state);
if (!Array.isArray(state.learnedThisWeek)) {
  state.learnedThisWeek = Array.isArray(state.learnedToday) ? state.learnedToday : [];
}
delete state.learnedToday;
delete state.weekCount;
if (!state.ratings || typeof state.ratings !== 'object') state.ratings = {};
if (needsMigration) saveState();

// The weekly goal is every phrase, learned once. A stride of 3 gives seven
// distinct daily sets whose union is the whole deck; the old stride of 4 only
// produced five distinct sets, so Fri/Sat repeated Sun/Mon and the goal of 25
// sat above the 20 phrases that actually exist.
const WEEK_GOAL = PHRASES.length;
const CARDS_PER_DAY = 5;
const dayOfWeek = new Date().getDay();
const offset = (dayOfWeek * 3) % PHRASES.length;
const todayPhrases = [];
for (let i = 0; i < CARDS_PER_DAY; i++) todayPhrases.push(PHRASES[(offset + i) % PHRASES.length]);

function buildDrillQueue() {
  const easy = new Set(Object.keys(state.ratings).filter(k => state.ratings[k] === 'easy'));
  const hard = PHRASES.filter(p => state.ratings[String(p.id)] === 'hard');
  const rest = PHRASES.filter(p => !easy.has(String(p.id)) && state.ratings[String(p.id)] !== 'hard');
  return [...hard, ...rest];
}

let drillQueue = [];
let drillIdx = 0;
let flipped = false;
let activeScenario = null;
let audioPlayer = null;

// A pass is a fixed snapshot of the queue. Ratings are recorded as you go but
// only take effect on the next pass, so the deck can never be reordered out
// from under the index we are about to advance.
function startDrillPass(avoidId) {
  drillQueue = buildDrillQueue();
  // Hard cards lead the next pass, so rating the final card hard would
  // otherwise hand it straight back as card 1. Demote it one slot: still
  // reviewed early, but never twice in a row.
  if (avoidId != null && drillQueue.length > 1 && drillQueue[0].id === avoidId) {
    drillQueue.splice(1, 0, drillQueue.shift());
  }
  drillIdx = 0;
  flipped = false;
}
startDrillPass();

function announce(msg) {
  const l = document.getElementById('live');
  if (l) l.textContent = msg;
}

// Only one voice at a time: a new tap silences both the recording and the
// synthesised voice, whichever was playing.
let speechToken = 0;
function stopSpeech() {
  speechToken++;
  if (audioPlayer) {
    audioPlayer.onended = null;
    audioPlayer.pause();
    audioPlayer = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function speakGerman(text, audioSrc) {
  stopSpeech();
  if (audioSrc) {
    const player = new Audio(audioSrc);
    audioPlayer = player;
    player.onended = () => announce('Finished: ' + text);
    player.play().then(() => announce(`Playing: ${text}`)).catch(err => {
      // Pausing a pending play() rejects it with AbortError. That is a newer
      // tap taking over, not a missing file, so it must not fall back and
      // speak this stale phrase over the new one.
      if (audioPlayer !== player || (err && err.name === 'AbortError')) return;
      audioPlayer = null;
      speakGerman(text);
    });
    return;
  }
  if (!('speechSynthesis' in window)) {
    announce('Speech playback is not supported in this browser.');
    return;
  }
  const token = speechToken;
  loadVoices().then(voices => {
    // Another tap arrived while the voice list was loading; it owns playback.
    if (token !== speechToken) return;
    speakWithVoices(text, voices);
  });
}

// Chrome fills the voice list asynchronously, so getVoices() is often empty
// on the first call. Wait for it (briefly) rather than falling back to a
// default voice for the first line spoken.
let voicesPromise = null;
function loadVoices() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);
  if (!voicesPromise) {
    voicesPromise = new Promise(resolve => {
      const done = () => {
        speechSynthesis.removeEventListener('voiceschanged', done);
        clearTimeout(timer);
        voicesPromise = null;
        resolve(speechSynthesis.getVoices());
      };
      const timer = setTimeout(done, 1000);
      speechSynthesis.addEventListener('voiceschanged', done);
    });
  }
  return voicesPromise;
}
if ('speechSynthesis' in window) loadVoices();

function speakWithVoices(text, voices) {
  const utterance = new SpeechSynthesisUtterance(text);
  const germanVoices = voices.filter(voice => voice.lang.toLowerCase().startsWith('de'));
  const germanVoice = germanVoices.sort((a, b) => voiceScore(b) - voiceScore(a))[0];
  utterance.lang = germanVoice ? germanVoice.lang : 'de-DE';
  utterance.rate = 0.8;
  utterance.pitch = 1;
  utterance.volume = 1;
  if (germanVoice) utterance.voice = germanVoice;
  utterance.onerror = event => {
    // A newer tap cancels this utterance on purpose; that is not a failure.
    if (event.error === 'canceled' || event.error === 'interrupted') return;
    announce(`Speech playback failed: ${event.error || 'unknown error'}.`);
  };
  speechSynthesis.resume();
  speechSynthesis.speak(utterance);
  announce(`Playing: ${text}`);
}

function voiceScore(voice) {
  const name = voice.name.toLowerCase();
  const lang = voice.lang.toLowerCase();
  let score = voice.localService ? 10 : 0;
  if (lang === 'de-at' || lang.startsWith('de-at-')) score += 100;
  if (name.includes('enhanced') || name.includes('premium') || name.includes('natural')) score += 30;
  if (name.includes('siri') || name.includes('anna') || name.includes('helena') || name.includes('katja')) score += 20;
  if (name.includes('compact')) score -= 15;
  return score;
}

function speakScenarioLine(button) {
  speakGerman(button.getAttribute('data-speech'));
}

// Standard tablist keyboard contract: arrows move between tabs, Home/End jump
// to the ends, and only the selected tab is in the document tab order.
function tabKey(e) {
  const tabs = [...document.querySelectorAll('.tab')];
  const i = tabs.indexOf(e.currentTarget);
  let next = -1;
  if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
  else if (e.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabs.length - 1;
  if (next < 0) return;
  e.preventDefault();
  tabs[next].focus();
  tabs[next].click();
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
    t.setAttribute('tabindex', '-1');
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  btn.setAttribute('tabindex', '0');
  if (id === 'drill') { startDrillPass(); renderDrill(); }
  if (id === 'scenario') renderScenario();
}

function togglePhrase(id) {
  const s = new Set(state.learnedThisWeek);
  if (s.has(id)) s.delete(id); else s.add(id);
  state.learnedThisWeek = [...s];
  saveState();
  renderLesson();
  announce(`${s.size} of ${WEEK_GOAL} phrases learned this week.`);
}

function renderLesson() {
  // innerHTML replacement drops the focused element, which would dump a
  // keyboard user back to the top of the page on every checkbox press.
  const prev = document.activeElement;
  const refocusId = prev && prev.classList.contains('cb') ? prev.getAttribute('data-phrase-id') : null;
  const learned = new Set(state.learnedThisWeek);
  const count = learned.size;
  const pct = Math.min(100, Math.round((count / WEEK_GOAL) * 100));
  let html = `
    <div class="progress-row">
      <span>This week's progress</span>
      <span>${count} of ${WEEK_GOAL} phrases</span>
    </div>
    <div class="progress-bar" role="progressbar" aria-label="This week's progress" aria-valuemin="0" aria-valuemax="${WEEK_GOAL}" aria-valuenow="${count}"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
  todayPhrases.forEach(p => {
    const done = learned.has(p.id);
    html += `<div class="phrase-card${done ? ' learned' : ''}">
      <button type="button" class="cb${done ? ' checked' : ''}" data-phrase-id="${p.id}" aria-pressed="${done}" aria-label="Mark ${p.german} as learned" onclick="togglePhrase(${p.id})">✓</button>
      <div class="phrase-body">
        <div class="phrase-german" lang="de">${p.german}</div>
        <div class="phrase-english">${p.english}</div>
        <div class="pronunc-badge">Say it: ${p.pronunciation}</div>
        <div class="cultural">${p.cultural}</div>
      </div>
      <button type="button" class="speak-btn" aria-label="Hear ${p.german}" title="Hear Austrian German" onclick='speakGerman(${JSON.stringify(p.german)}, "audio/phrase-${p.id}.mp3")'>&#128266;</button>
    </div>`;
  });
  document.getElementById('lesson').innerHTML = html;
  if (refocusId) {
    const again = document.querySelector(`.cb[data-phrase-id="${refocusId}"]`);
    if (again) again.focus();
  }
}

function isDrillFocus(el) {
  return !!el && (el.id === 'fcw' || el.classList.contains('rate-btn') || el.classList.contains('drill-reset'));
}

function restoreDrillFocus() {
  const t = document.getElementById('fcw') || document.querySelector('.drill-reset');
  if (t) t.focus();
}

function renderDrill() {
  const el = document.getElementById('drill');
  // Same reason as renderLesson: rating a card replaces the whole panel, so
  // without this the keyboard user loses their place after every rating.
  const keepFocus = isDrillFocus(document.activeElement);
  if (drillQueue.length === 0) {
    el.innerHTML = `
      <div class="drill-empty">
        <p>Every phrase is rated easy — great work.</p>
        <button type="button" class="drill-reset" onclick="resetDeck()">Start the deck again</button>
      </div>`;
    if (keepFocus) restoreDrillFocus();
    return;
  }
  if (drillIdx >= drillQueue.length) drillIdx = 0;
  const p = drillQueue[drillIdx];
  const badge = state.ratings[String(p.id)] === 'hard' ? ' · <span style="color:var(--hard);font-size:11px;">Review card</span>' : '';
  el.innerHTML = `
    <div class="drill-status">Card ${drillIdx + 1} of ${drillQueue.length}${badge} — tap to flip</div>
    <div class="flip-container" id="fcw" role="button" tabindex="0" aria-pressed="${flipped}" aria-label="${flipCardLabel(p)}" onclick="flipCard()" onkeydown="flipKey(event)">
      <div class="flip-card${flipped ? ' flipped' : ''}" id="fc">
        <div class="flip-face front" id="fcFront" aria-hidden="${flipped}">
          <div class="flip-hint">English — what's the German?</div>
          <div class="flip-word">${p.english}</div>
          <div class="flip-sub" style="margin-top:8px;font-size:12px;">Tap to reveal</div>
        </div>
        <div class="flip-face back" id="fcBack" aria-hidden="${!flipped}">
          <div class="flip-hint">German</div>
          <div class="flip-word" lang="de">${p.german}</div>
          <div class="flip-pronunc">${p.pronunciation}</div>
        </div>
      </div>
    </div>
    <button type="button" class="speak-btn drill-speak" id="drillSpeak" style="visibility:${flipped ? 'visible' : 'hidden'}" aria-label="Hear ${p.german}" title="Hear Austrian German" onclick='speakGerman(${JSON.stringify(p.german)}, "audio/phrase-${p.id}.mp3")'>&#128266;</button>
    <div class="rating-row" id="rr" style="visibility:${flipped ? 'visible' : 'hidden'}">
      <button class="rate-btn easy" onclick="rate(${p.id},'easy')">Easy ✓</button>
      <button class="rate-btn medium" onclick="rate(${p.id},'medium')">Medium</button>
      <button class="rate-btn hard" onclick="rate(${p.id},'hard')">Hard — back tomorrow</button>
    </div>
  `;
  if (keepFocus) restoreDrillFocus();
}

// backface-visibility hides the unrevealed side visually but leaves its text in
// the accessibility tree, so a screen reader would read the answer out before
// the user flipped. aria-hidden is what actually hides it.
function flipCardLabel(p) {
  return flipped
    ? `Flashcard revealed. German: ${p.german}. Activate to hide.`
    : `Flashcard: ${p.english}. Activate to reveal the German.`;
}

function flipCard() {
  flipped = !flipped;
  const p = drillQueue[drillIdx];
  const fc = document.getElementById('fc');
  const rr = document.getElementById('rr');
  const fcw = document.getElementById('fcw');
  const front = document.getElementById('fcFront');
  const back = document.getElementById('fcBack');
  if (fc) fc.classList.toggle('flipped', flipped);
  if (rr) rr.style.visibility = flipped ? 'visible' : 'hidden';
  // The speaker says the answer, so it stays hidden (visually and from screen
  // readers) until the card is turned over, just like the rating row.
  const ds = document.getElementById('drillSpeak');
  if (ds) ds.style.visibility = flipped ? 'visible' : 'hidden';
  if (front) front.setAttribute('aria-hidden', String(flipped));
  if (back) back.setAttribute('aria-hidden', String(!flipped));
  if (fcw) {
    fcw.setAttribute('aria-pressed', String(flipped));
    if (p) fcw.setAttribute('aria-label', flipCardLabel(p));
  }
  if (p) announce(flipped ? `German: ${p.german}. ${p.pronunciation}` : 'Answer hidden.');
}

function flipKey(e) {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    flipCard();
  }
}

function rate(id, level) {
  state.ratings[String(id)] = level;
  saveState();
  if (drillIdx + 1 >= drillQueue.length) {
    // End of the pass — now it is safe to apply the new ratings, which retire
    // easy cards and pull hard ones to the front of the next pass.
    startDrillPass(id);
  } else {
    drillIdx++;
    flipped = false;
  }
  renderDrill();
  const next = drillQueue[drillIdx];
  announce(next
    ? `Rated ${level}. Card ${drillIdx + 1} of ${drillQueue.length}: ${next.english}`
    : `Rated ${level}. Deck complete.`);
}

function resetDeck() {
  state.ratings = {};
  saveState();
  startDrillPass();
  renderDrill();
}

function renderScenario() {
  const el = document.getElementById('scenario');
  const buttons = SCENARIOS.map(sc => `
    <button type="button" class="sc-card${activeScenario === sc.id ? ' active' : ''}" aria-pressed="${activeScenario === sc.id}" onclick="selectScenario('${sc.id}')">
      <div class="sc-icon" aria-hidden="true">${sc.icon}</div>
      <div class="sc-name">${sc.name}</div>
      <div class="sc-place">${sc.place}</div>
    </button>`).join('');

  let scriptHtml = '<div class="no-scenario">Pick a scenario above to see the full script</div>';
  if (activeScenario) {
    const sc = SCENARIOS.find(s => s.id === activeScenario);
    if (sc) {
      const lines = sc.script.map(l => `
        <div class="line">
          <div class="speaker">${l.s}</div>
          <div class="line-body">
            <div class="line-de" lang="de">${l.de}</div>
            <div class="line-en">${l.en}</div>
            <button type="button" class="speak-btn line-audio" data-speech="${l.de.replace(/<[^>]*>/g, '').replace(/\([^)]*\)\s*/g, '').replace(/&amp;/g, '&').replace(/&quot;/g, '"')}" aria-label="Hear German line" title="Hear German" onclick="speakScenarioLine(this)">&#128266;</button>
          </div>
        </div>`).join('');
      scriptHtml = `
        <div class="script-box">
          <div class="script-top">${sc.name} · ${sc.place}</div>
          <div class="script-body">${lines}</div>
        </div>`;
    }
  }

  el.innerHTML = `<div class="scenario-grid">${buttons}</div>${scriptHtml}`;
}

function selectScenario(id) {
  activeScenario = activeScenario === id ? null : id;
  renderScenario();
}

renderLesson();
renderDrill();
renderScenario();
</script>
</body>
</html>
